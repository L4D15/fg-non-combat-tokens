name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is X.Y.Z and on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Tag $GITHUB_REF_NAME is not X.Y.Z"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Check extension version matches tag
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('ext/extension.xml').find('properties/version').text)")
          [ "$version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::ext/extension.xml version $version does not match tag $GITHUB_REF_NAME"; exit 1; }

      - name: Test
        run: |
          sudo apt-get update -q && sudo apt-get install -yq luajit
          tests/run.sh

      - name: Build
        run: python3 build.py --no-install

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/NonCombatTokens.ext \
            --title "Non-Combat Tokens $GITHUB_REF_NAME" --generate-notes
